name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safety-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Check shell syntax
        run: |
          find installer management tests build -type f -perm -u+x -print0 |
            xargs -0 -n1 bash -n
      - name: ShellCheck
        run: |
          find installer management tests build -type f -perm -u+x -print0 |
            xargs -0 shellcheck
      - name: Run isolated installer simulations
        run: tests/install-gate-simulation.sh
      - name: Run management safety simulations
        run: tests/management-simulation.sh
      - name: Verify repository contracts
        run: tests/repository-contract.sh
